<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc"><title id="title">CourseOps: resource and configuration ownership</title><desc id="desc">The operator reaches one public EC2 host through an internet gateway. Private subnet pairs have no default egress. Terraform owns the infrastructure and state; Ansible configures the host.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8eacbf"/></marker></defs><rect width="1000" height="710" rx="20" fill="#101c2e"/><g font-family="system-ui,sans-serif" fill="#eef6ff"><text x="40" y="48" font-size="26" font-weight="700">CourseOps: resource and configuration ownership</text><rect x="40" y="85" width="275" height="100" rx="12" fill="#243a51" stroke="#64859a"/><text x="58" y="115" font-size="19" font-weight="650">Operator</text><text x="58" y="143" font-size="16" fill="#c9d9e5">Verified SSH key</text><text x="58" y="167" font-size="16" fill="#c9d9e5">HTTP + SSH from one /32</text><rect x="365" y="85" width="275" height="100" rx="12" fill="#243a51" stroke="#64859a"/><text x="383" y="115" font-size="19" font-weight="650">Terraform</text><text x="383" y="143" font-size="16" fill="#c9d9e5">VPC, routing, EC2, access</text><text x="383" y="167" font-size="16" fill="#c9d9e5">State binds addresses to IDs</text><rect x="690" y="85" width="270" height="100" rx="12" fill="#243a51" stroke="#64859a"/><text x="708" y="115" font-size="19" font-weight="650">Ansible</text><text x="708" y="143" font-size="16" fill="#c9d9e5">Nginx + status page</text><text x="708" y="167" font-size="16" fill="#c9d9e5">Repeatable host configuration</text><rect x="40" y="260" width="920" height="340" rx="16" fill="#152b3b" stroke="#6cb7bd"/><text x="62" y="292" font-size="21" font-weight="650">VPC · 10.42.0.0/16</text><rect x="65" y="315" width="425" height="125" rx="12" fill="#243a51" stroke="#64859a"/><text x="83" y="345" font-size="19" font-weight="650">Public subnet pair</text><text x="83" y="373" font-size="16" fill="#c9d9e5">a: 10.42.0.0/24 · web instance</text><text x="83" y="397" font-size="16" fill="#c9d9e5">b: 10.42.1.0/24 · no second instance</text><text x="83" y="421" font-size="16" fill="#c9d9e5">Default route → internet gateway</text><rect x="520" y="315" width="415" height="125" rx="12" fill="#243a51" stroke="#64859a"/><text x="538" y="345" font-size="19" font-weight="650">Private subnet pair</text><text x="538" y="373" font-size="16" fill="#c9d9e5">a: 10.42.10.0/24</text><text x="538" y="397" font-size="16" fill="#c9d9e5">b: 10.42.11.0/24</text><text x="538" y="421" font-size="16" fill="#c9d9e5">No default internet route in core</text><rect x="65" y="475" width="425" height="95" rx="12" fill="#243a51" stroke="#64859a"/><text x="83" y="505" font-size="19" font-weight="650">One Ubuntu EC2 host</text><text x="83" y="533" font-size="16" fill="#c9d9e5">Public IPv4 · encrypted disk · IMDSv2</text><text x="83" y="557" font-size="16" fill="#c9d9e5">Nginx page and /healthz after Ansible</text><rect x="520" y="475" width="415" height="95" rx="12" fill="#243a51" stroke="#64859a"/><text x="538" y="505" font-size="19" font-weight="650">Optional extension</text><text x="538" y="533" font-size="16" fill="#c9d9e5">NAT: outbound internet access</text><text x="538" y="557" font-size="16" fill="#c9d9e5">S3 endpoint: S3 access only</text><path d="M177 185 V245 H450 V315" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M502 185 V235 H480 V260" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M825 185 V235 H975 V585 H277 V570" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M277 440 V475" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="642" font-size="18">State: separate versioned S3 backend after migration; not an application backup.</text><text x="40" y="677" font-size="17" fill="#f3cb87">Teaching scope: one host, restricted HTTP, no load balancer or high availability.</text></g></svg>