<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Remove bob: compare identity</title><desc id="desc">Count shifts identities at later indices; for_each removes only the bob key.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="720" height="440" rx="18" fill="#f8fafc"/>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">Remove bob: compare identity</text>
<rect x="30" y="80" width="310" height="121" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="46" y="109" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">count: positions</text>
<text x="46" y="135" font-family="Arial,sans-serif" font-size="16" fill="#334155">[0] alice → alice</text>
<text x="46" y="157" font-family="Arial,sans-serif" font-size="16" fill="#334155">[1] bob → charlie</text>
<text x="46" y="179" font-family="Arial,sans-serif" font-size="16" fill="#334155">[2] charlie → removed</text>
<rect x="380" y="80" width="310" height="121" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="396" y="109" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">for_each: names</text>
<text x="396" y="135" font-family="Arial,sans-serif" font-size="16" fill="#334155">[alice] → unchanged</text>
<text x="396" y="157" font-family="Arial,sans-serif" font-size="16" fill="#334155">[bob] → removed</text>
<text x="396" y="179" font-family="Arial,sans-serif" font-size="16" fill="#334155">[charlie] → unchanged</text>
<rect x="70" y="300" width="580" height="99" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="86" y="329" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Inspect provider behavior</text>
<text x="86" y="355" font-family="Arial,sans-serif" font-size="16" fill="#334155">A changed attribute may update or replace an object.</text>
<text x="86" y="377" font-family="Arial,sans-serif" font-size="16" fill="#334155">Stable keys preserve identity when list membership changes.</text>
</svg>
