<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">Provisioned does not mean ready</title><desc id="desc">Cloud provisioning hands off to verified SSH. Cloud-init completes before configuration, then HTTP and repeat-run checks prove behavior.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="720" height="370" rx="18" fill="#f8fafc"/>
<text x="28" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">Provisioned does not mean ready</text>
<path d="M335 118 L385 118" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M540 157 L540 245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M385 284 L335 284" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="25" y="80" width="310" height="77" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="41" y="109" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Terraform complete</text>
<text x="41" y="135" font-family="Arial,sans-serif" font-size="16" fill="#334155">Instance and network exist</text>
<rect x="385" y="80" width="310" height="77" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="401" y="109" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Verified SSH identity</text>
<text x="401" y="135" font-family="Arial,sans-serif" font-size="16" fill="#334155">Trusted host key + connectivity</text>
<rect x="385" y="245" width="310" height="77" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="401" y="274" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Cloud-init complete</text>
<text x="401" y="300" font-family="Arial,sans-serif" font-size="16" fill="#334155">Then gather facts and configure</text>
<rect x="25" y="245" width="310" height="77" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
<text x="41" y="274" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Verify the result</text>
<text x="41" y="300" font-family="Arial,sans-serif" font-size="16" fill="#334155">HTTP works; rerun converges</text>
</svg>
