<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc"><title id="title">Recover from evidence, not from habit</title><desc id="desc">Freeze writers and classify the incident. A live lock requires coordination; a partial apply requires inspection and a fresh plan; missing bindings require verified import; application data loss requires application backups.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8eacbf"/></marker></defs><rect width="1000" height="710" rx="20" fill="#101c2e"/><g font-family="system-ui,sans-serif" fill="#eef6ff"><text x="40" y="48" font-size="26" font-weight="700">Recover from evidence, not from habit</text><rect x="250" y="85" width="500" height="95" rx="12" fill="#243a51" stroke="#64859a"/><text x="268" y="115" font-size="19" font-weight="650">Stop concurrent changes</text><text x="268" y="143" font-size="16" fill="#c9d9e5">Capture the error, target identity and state key</text><text x="268" y="167" font-size="16" fill="#c9d9e5">Do not delete state to make a failure disappear</text><path d="M500 180 V210 H265 V235" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 210 H735 V235" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="235" width="440" height="135" rx="12" fill="#243a51" stroke="#64859a"/><text x="58" y="265" font-size="19" font-weight="650">Lock or partial apply?</text><text x="58" y="293" font-size="16" fill="#c9d9e5">Active lock → coordinate with its owner</text><text x="58" y="317" font-size="16" fill="#c9d9e5">Partial success → inspect completed objects</text><text x="58" y="341" font-size="16" fill="#c9d9e5">Fix the cause, then create a fresh plan</text><rect x="520" y="235" width="440" height="135" rx="12" fill="#243a51" stroke="#64859a"/><text x="538" y="265" font-size="19" font-weight="650">Missing or damaged records?</text><text x="538" y="293" font-size="16" fill="#c9d9e5">Object exists, binding missing → verified import</text><text x="538" y="317" font-size="16" fill="#c9d9e5">Corrupt state → coordinated version recovery</text><text x="538" y="341" font-size="16" fill="#c9d9e5">Lost application data → application restore</text><path d="M265 370 V420 H500 V455" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M735 370 V420 H500" fill="none" stroke="#8eacbf" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="180" y="455" width="640" height="110" rx="12" fill="#243a51" stroke="#64859a"/><text x="198" y="485" font-size="19" font-weight="650">Reconcile and review before writing</text><text x="198" y="513" font-size="16" fill="#c9d9e5">Compare real object IDs, configuration and recovered state</text><text x="198" y="537" font-size="16" fill="#c9d9e5">Expected actions only? Review and apply the new saved plan.</text><text x="198" y="561" font-size="16" fill="#c9d9e5">Unexpected replacement or deletion? Stop and investigate.</text><text x="70" y="622" font-size="19" font-weight="650">State restore does not rewind real infrastructure.</text><text x="70" y="662" font-size="18" fill="#c9d9e5">Finish with health checks, a no-change plan, and a short incident report.</text></g></svg>